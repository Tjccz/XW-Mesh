# =====================================================================
#  湘网组网 · 控制台  —— Dockge / docker compose 可直接使用
#
#  适用：飞牛 NAS / iStoreOS 软路由 / 群晖 / 宝塔面板等已装 Docker 的环境
#
#  【重要】镜像尚未发布到任何 registry，`docker pull` 取不到。
#          必须先用源码本地构建（预构建前端，很快）：
#      docker build -f deploy/dockge/Dockerfile.slim -t xiangwang-mesh-console:1.1.0 .
#
#  变量请在同级 .env 中设置（Dockge 有 .env 编辑入口），见 .env.example
# =====================================================================

services:
  console:
    image: xiangwang-mesh-console:${XW_VERSION:-1.1.0}
    container_name: xiangwang-console
    restart: unless-stopped
    ports:
      # 左侧为宿主机端口，右侧是容器内端口（不要改右侧）。
      # 默认 6088 —— 刻意避开 NAS/软路由上常被占用的 8080。
      - "${HOST_PORT:-6088}:8080"
    environment:
      PORT: 8080
      DATA_DIR: /data
      TZ: ${TZ:-Asia/Shanghai}
      XW_VERSION: ${XW_VERSION:-1.1.0}
      ET_VERSION: ${ET_VERSION:-2.6.4}
      # 留空即可：程序会回退成「浏览器当前访问的地址」，
      # 换机器/换端口都不用改配置。只有走域名或反向代理时才需要显式指定。
      CONSOLE_URL: ${CONSOLE_URL:-}
      ADMIN_USER: ${ADMIN_USER:-admin}
      # 不设默认值，强制你在 .env 里填，避免用弱口令上线
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请先在 .env 中设置 ADMIN_PASSWORD}
    volumes:
      # 数据库、配置快照全部落在这里，备份只需拷这一个目录
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
